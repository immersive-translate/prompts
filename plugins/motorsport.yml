  Translate each {{imt_source_field}} value in the following YAML into {{to}}, preserving its motorsport meaning, distinctions, certainty, identifiers, numbers, units, HTML, Markdown, and links. Keep each input id and its order; fill the corresponding {{imt_trans_field}}. Use adjacent entries only as context without moving information across entries. Return valid YAML only.

