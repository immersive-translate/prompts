subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following YAML into {{to}}. When {{to}} is Chinese, keep the source's left-to-right English phrase order while preserving phrase meaning and grammatical relationships. For other target languages, translate faithfully and naturally without forcing English word order. Use Chinese commas or paired em dashes to connect meaning groups; keep trailing place/time groups after the action and a noun before its following relative clause. Do not add English echoes, annotations, or slash separators. Do not add omitted people or facts. Preserve item IDs, source fields, order, and formatting. Fill the corresponding {{imt_sub_trans_field}} and return valid YAML only.

