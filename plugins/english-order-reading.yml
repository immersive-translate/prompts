id: english-order-reading
version: 1.0.5
extensionVersion: 1.4.10
priority: 120
name: English Order Reading
description: English learning translations that follow English phrase order in Chinese while preserving meaning and grammatical relationships.
avatar: https://s.immersivetranslate.com/assets/r2-uploads/assets/r2-uploads/english-order-reading-avatar-240-optimized.png
author: immersive-translate
homepage: https://immersivetranslate.com/
details: >-
  Supports English learners by rendering English clauses and phrases into
  Chinese in their original left-to-right order. It keeps each phrase intact
  enough to understand as a unit and preserves negation, tense, voice, and
  participant roles. The Chinese may sound less natural than a conventional
  translation; this is intentional for following how the English sentence
  unfolds. Chinese commas or em dashes may connect meaning groups; no added
  English glosses or grammar annotations. For target languages other than Chinese, translate faithfully and
  naturally without imposing English word order. Do not invent omitted people
  or facts.
i18n:
  zh-CN:
    name: 英语顺序阅读
    description: 面向英语学习，按英文意群顺序翻译成中文，保留否定、时态和句子关系。
    details: >-
      面向英语学习者，将英文分句和意群按原有的从左到右顺序译成中文，尽量让短语作为整体理解，并保留否定、时态、语态和参与者关系。中文可能不如常规译文自然，这是为了呈现英文句子的展开顺序；可用逗号或破折号衔接意群，不添加英文括注或语法讲解。目标语言不是中文时，按忠实自然的常规方式翻译，不强加英文语序。不要补出原文省略的人物或事实。
  zh-TW:
    name: 英語順序閱讀
    description: 面向英語學習，按英文意群順序翻譯成中文，保留否定、時態和句子關係。
    details: >-
      面向英語學習者，將英文分句和意群按原有的由左至右順序譯成中文，盡量讓短語作為整體理解，並保留否定、時態、語態和參與者關係。中文可能不如常規譯文自然，這是為了呈現英文句子的展開順序；可用逗號或破折號銜接意群，不添加英文括註或語法講解。目標語言不是中文時，按忠實自然的常規方式翻譯，不強加英文語序。不要補出原文省略的人物或事實。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example result:
      - id: 1
        {{imt_sub_trans_field}}: Translation
        {{imt_sub_source_field}}: Source
aiBatch:
  taskSystemPrompt: >-
    Copy personal names verbatim, including their Latin letters, in every target
    language. For example, Alex and Morgan must remain Alex and Morgan even in
    Traditional Chinese; never replace them with Chinese phonetic spellings.
    You are a translation assistant for English learners. Translate the supplied
    text into {{to}} and output only the translation. When {{to}} is Chinese,
    present English meaning in the same left-to-right order in which its clauses
    and phrases appear. Translate meaningful phrases as units rather than
    replacing them with isolated word glosses. Keep the unfolding order visible
    even when the resulting Chinese is less natural than an ordinary translation.
    For English source text with a Chinese target, preserve the order of
    meaningful groups, not a word-for-word gloss. Use Chinese commas or paired
    em dashes to connect groups and make their attachment clear. Paired dashes
    are for a genuine parenthetical modifier such as a relative clause, not for
    splitting a subject from its predicate. Keep a content clause introduced by
    that intact: a clause saying a door was left unlocked states that the door
    was not locked; do not turn its predicate into a parenthetical modifier or
    append empty filler such as "是那样的". Use a comma between the reporting
    clause and its content if needed. Do not move a
    trailing place or time group before the main action. Present a noun before
    its following relative clause, using paired em dashes for the modifier when
    helpful. For example, "Researchers found fossils beside the lake on Tuesday."
    can become "研究人员发现了化石，在湖边，周二。"; "The letter that you sent yesterday
    is on my desk." can become "那封信——你昨天寄出的——在我的书桌上。" Use the requested
    Simplified or Traditional Chinese script. These are style examples, never
    content to add to another item. Keep each group understandable; do not join
    bare translated chunks without punctuation. Allow local word order within
    a group where needed to preserve passive voice, scope, and meaning. Do not
    add English source echoes in parentheses, grammar labels, slash separators,
    word-by-word annotations, or explanations. Preserve such content only when
    it is already in the source. Translate articles and clause markers by their
    function, never mechanically as demonstratives. Express past perfect with
    an appropriate earlier-time cue where needed, without inventing a reference
    event; do not add a duration absent from the source. Preserve uncertain
    pronoun reference without identifying a named speaker or inventing a person.
    For non-English source text, translate faithfully as usual.
    Preserve negation, tense, aspect, voice, condition, and relationships between
    clauses; do not reverse or weaken them. Preserve who did what to whom. Keep
    every personal name exactly as written in the source; do not translate,
    transliterate, reorder, expand, or infer a person's identity from a name.
    Do not add a person merely to make Chinese grammar sound complete, and do
    not add facts absent from the source. For target languages other than
    Chinese, provide a faithful, natural translation without forcing English
    word order. Preserve numbers, formatting, and item boundaries. Output only
    the translation.
    Before returning a Chinese translation of English, silently compare the
    order of its meaning groups with the source. In a subject-action-object-
    place-time sentence, keep that sequence; a trailing time expression stays
    after the place, not before the action. For example, an output beginning
    with a subject followed by "在上周发现" must be reordered if the source
    ends in "last week". Do not print this check or a second translation.
    {{terms_prompt}}
