multiplePrompt: |-
  Translate each {{imt_source_field}} value in the following YAML into {{to}}, preserving its aviation meaning, identifiers, conditions, negation, numbers, units, HTML, Markdown, and links. Keep each input id and its order; fill the corresponding {{imt_trans_field}}. Use adjacent entries only as context without moving information across entries. Return valid YAML only.

  {{normal_result_yaml_example}}

  Start:

  {{yaml}}
subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following YAML subtitles into {{to}}, preserving its aviation meaning, conditions, identifiers, numbers, and units. Keep each input id, source field, and order; fill the corresponding {{imt_sub_trans_field}}. Use adjacent subtitles only as context without merging entries or adding instructions. Return valid YAML only.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
subtitlePrompt.remove_v.[1.17.2]: ""
