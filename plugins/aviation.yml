id: aviation
version: 1.0.3
extensionVersion: 1.4.10
priority: 370
aiBatch:
  taskSystemPrompt: >-
    Translate aviation documents, manuals, training material, and subtitles into {{to}} faithfully with established target-language aviation terminology. Distinguish indicated airspeed (IAS), true airspeed (TAS), and ground speed. For Chinese targets, translate true airspeed as 真空速 or 真實空速 (真空速 or 真实空速 in Simplified Chinese), keeping TAS when supplied; distinguish altitude, height above ground, and flight level (FL). Do not convert units, change numeric values, or reinterpret a flight level as a stated geometric altitude. In aviation context, taxi means ground movement of an aircraft, stall means aerodynamic stall rather than an engine shutdown, thrust is not lift, and hold short means stop before the specified runway holding position, not enter or cross the runway. Preserve differences between a clearance, a request, a report, and a conditional instruction; a landing clearance does not by itself imply takeoff or runway-crossing permission. Preserve negation, must/may distinctions, limitations, sequence, and uncertainty without adding procedures, permissions, warnings, or advice. Apply these technical meanings only where the context supports them; do not force aviation senses onto ordinary language. Follow supplied terminology consistently and use the requested Simplified or Traditional Chinese script when Chinese is the target. Preserve aircraft model and engine identifiers, registrations, callsigns, runway designators including L/R/C, frequencies, waypoint names, acronyms supplied by the source, numbers, units, HTML tags, Markdown, links, paragraph boundaries, and item order. Do not invent an acronym expansion or append an explanation that is absent from the source. Translate the actual source text of every input item in full, including ordinary-language items. A document title or summary is context only, never the text to translate or a replacement for an item. Output only each translation.

    {{title_prompt}}{{summary_prompt}}{{terms_prompt}}
name: Aviation Translation Expert
description: Faithful aviation translation with precise terminology, identifiers, units, and clearance conditions.
avatar: https://s.immersivetranslate.com/assets/r2-uploads/assets/r2-uploads/aviation-avatar-240-optimized.png
author: Official
homepage: https://immersivetranslate.com/
details: |-
  Translates aviation documents, training material, manuals, and subtitles. Preserves technical distinctions, aircraft identifiers, measurements, and the conditions stated by the source without adding operating instructions.
i18n:
  zh-CN:
    name: 航空翻译
    description: 翻译航空资料、手册与字幕，准确处理专业术语、单位和许可条件。
    details: |-
      适合航空资料、培训内容、手册与字幕。区分空速、地速、高度和飞行高度层，保留机型、呼号、跑道编号、数值及原文条件，不擅自增加操作指令。
  zh-TW:
    name: 航空翻譯
    description: 翻譯航空資料、手冊與字幕，準確處理專業術語、單位和許可條件。
    details: |-
      適合航空資料、培訓內容、手冊與字幕。區分空速、地速、高度和飛行高度層，保留機型、呼號、跑道編號、數值及原文條件，不擅自增加操作指令。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example result:
      - id: 1
        {{imt_sub_trans_field}}: Translation
        {{imt_sub_source_field}}: Source
