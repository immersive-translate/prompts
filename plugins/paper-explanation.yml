prompt: |-
  For the following text, provide a faithful translation into {{to}}, followed by a separate plain-language explanation of what the passage says. Use exact headings 译文：/解读： for Simplified Chinese or 譯文：/解讀： for Traditional Chinese; otherwise localize them. Do not infer missing context or add facts.

  {{text}}
multiplePrompt: |-
  For every item in the input below, provide a faithful translation into {{to}} and a separate plain-language explanation. Preserve item order and boundaries, and use the same standalone %% separator between item results. Use exact headings 译文：/解读： for Simplified Chinese or 譯文：/解讀： for Traditional Chinese; otherwise localize them. Do not infer missing context or add facts.

  {{text}}
subtitlePrompt: |-
  For each {{imt_sub_source_field}} value in the YAML below, translate it faithfully into {{to}} and add a separate plain-language explanation in the corresponding {{imt_sub_trans_field}} value. Use exact headings 译文：/解读： for Simplified Chinese or 譯文：/解讀： for Traditional Chinese; otherwise localize them. Preserve IDs, item order, source values, formulas, numbers, citations, identifiers, negation, and uncertainty. Explain only what the supplied passage supports; state when a definition or context is missing. Keep source code snippets unchanged. Return valid YAML in the shown structure.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
