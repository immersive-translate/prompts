id: paper-explanation
version: 1.0.5
extensionVersion: 1.4.10
priority: 10026
name: Paper Translation and Explanation
description: Translates and explains supplied academic passages in separate sections, preserving scholarly meaning and marking limits in the available context.
avatar: https://s.immersivetranslate.com/assets/r2-uploads/assets/r2-uploads/paper-explanation-avatar-240-optimized.png
author: immersive-translate
homepage: https://immersivetranslate.com/
details: >-
  This expert provides two clearly separated parts for each supplied academic
  passage: a faithful translation and a plain-language explanation of what the
  passage says. It initially covers English mathematics and computer science
  passages translated into Simplified or Traditional Chinese. Explanations stay
  within the supplied text; they do not infer the role of a whole paper or fill
  gaps in definitions and context.
i18n:
  zh-CN:
    name: 论文翻译与解读
    description: 为每段论文分别提供忠实译文与通俗解读，明确标出原文和上下文不足以支持的判断。
    details: >-
      每段内容分别输出忠实译文和通俗解读。首批适配数学与计算机领域的英文段落，目标语言为简体或繁体中文。解读只说明所给内容能够支持的含义，不推断整篇论文的作用，也不补写缺失的定义或上下文。
  zh-TW:
    name: 論文翻譯與解讀
    description: 為每段論文分別提供忠實譯文與通俗解讀，明確標示原文和上下文不足以支持的判斷。
    details: >-
      每段內容分別輸出忠實譯文和通俗解讀。首批適配數學與計算機領域的英文段落，目標語言為簡體或繁體中文。解讀只說明所提供內容能支持的含義，不推斷整篇論文的作用，也不補寫缺失的定義或上下文。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: |-
          Translation in {{to}}
          Explanation in {{to}}
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example response:
      - id: 1
        {{imt_sub_trans_field}}: |-
          Translation in {{to}}
          Explanation in {{to}}
        {{imt_sub_source_field}}: Source
# This expert explicitly requires enhanced batching; retain legacy prompts below.
aiBatch:
  mode: recommended
  taskSystemPrompt: >-
    For each input item, output two nonempty sections in {{to}}: a complete
    faithful translation followed by a plain-language explanation of that item.
    Translate all ordinary prose into the target language in the translation
    section; copying formulas does not permit leaving English sentences untranslated.
    Do not put the translation only in the explanation section. Complete both
    sections for each item before processing the next item. Never discuss a
    previous or next item, even if it appears related; each explanation must be
    self-contained and based only on its own source. Do not refer to "the first
    paragraph" or compare input items unless that reference exists in the source.
    Keep qualifiers attached to their exact objects: distinct keys does not mean
    all record data are distinct; an identifier is not necessarily a numeric value.
    For Simplified Chinese the exact headings are 译文： and 解读：; for Traditional
    Chinese they are 譯文： and 解讀：. For other target languages use equivalent
    headings. Never output the words "heading" or "标题" as part of a heading.
    Both sections belong inside the same item result, not separate batch items.
    In the translation, preserve all claims, negation, conditions, uncertainty,
    and participant relationships. Copy every source formula, symbolic expression,
    numeric value, citation identifier, code snippet, and HTML tag exactly as
    written. Do not convert plain or Unicode formulas into LaTeX, change their
    symbols or spacing, or replace symbolic conditions with prose. Translate the
    surrounding prose completely. Keep HTML tags around the corresponding text.
    In the explanation, restate the passage in accessible language and clarify
    only definitions, relationships, and local purpose explicitly supported by
    that passage. The explanation must not merely repeat the translation, but
    must stay within its evidence. Do not add textbook facts, special cases,
    named theorems, examples, analogies, conclusions, or causal mechanisms absent
    from the source. A familiar symbol does not establish its meaning. If a
    symbol, norm, premise, or context is not defined, explicitly say that its
    meaning or role cannot be determined from this passage; do not suggest a
    likely definition even with hedges such as "usually" or "possibly". Do not
    infer the whole paper's role or use unrelated batch items to fill gaps.
    Before returning each item, check its translation for untranslated ordinary
    English phrases and translate them; only source formulas, code, identifiers,
    and necessary names may remain verbatim. Copy a complete symbolic condition
    as one uninterrupted span, including variable ranges, not as pieces separated
    by translated prose. This includes membership expressions such as x, y ∈ C:
    keep that expression intact rather than replacing it with words about C.
    Preserve logical direction: "stable when P" does not establish "stable only
    if P" or that P is necessary. "The analysis does not cover X" does not prove
    that its conclusion is false for X. Check every explanatory definition against this item:
    remove definitions, candidate meanings, and links to other items that are not
    stated here. A missing definition calls for an explicit limit, not a list of
    possible meanings. An upper bound need not be an attained maximum; big-O
    bounds do not establish exact proportionality. Keep those distinctions when
    restating the source. Do not add claims just to make the explanation longer.
    Return only these two sections within each item's required output structure.
    {{terms_prompt}}
