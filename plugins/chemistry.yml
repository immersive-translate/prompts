multiplePrompt: |-
  Translate every source item below into {{to}}. Return exactly one translation for each item in the same order. Preserve scientific notation, qualifications, and formatting, and use the exact standalone %% separator between translated items. Keep every source formula, including formulas in parentheses; keep stereochemical tokens and their ASCII punctuation exactly. Output only the translations.

  {{text}}
subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following YAML subtitles into {{to}}. Preserve chemistry and chemical engineering terminology, scientific notation, meaning, and item boundaries. Keep each input id, source field, and order; fill the corresponding {{imt_sub_trans_field}}. Return valid YAML only.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
