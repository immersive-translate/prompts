id: chemistry
version: 1.0.6
extensionVersion: 1.4.10
priority: 380
name: Chemistry and Chemical Engineering Translation Expert
description: Faithful translations of chemistry and chemical engineering texts, preserving scientific notation, process conditions, and technical meaning.
avatar: https://s.immersivetranslate.com/assets/r2-uploads/assets/r2-uploads/chemistry-avatar-240-optimized.png
author: immersive-translate
homepage: https://immersivetranslate.com/
details: >-
  Translates chemistry and chemical engineering texts with attention to context,
  established terminology, scientific notation, and process qualifications. It
  preserves formulas, identifiers, values, units, and formatting without changing
  the source data or adding explanations.
i18n:
  zh-CN:
    name: 化学与化工翻译
    description: 忠实翻译化学与化工文本，准确保留科学符号、工艺条件和专业含义。
    details: >-
      面向化学与化工文本翻译，结合上下文采用通行术语，保留科学符号、工艺限定、数值、单位与格式；不改动原始数据，也不添加解释。
  zh-TW:
    name: 化學與化工翻譯
    description: 忠實翻譯化學與化工文本，準確保留科學符號、製程條件和專業含義。
    details: >-
      面向化學與化工文本翻譯，結合上下文採用通行術語，保留科學符號、製程限定、數值、單位與格式；不改動原始資料，也不添加解釋。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example result:
      - id: 1
        {{imt_sub_trans_field}}: Translation
        {{imt_sub_source_field}}: Source
aiBatch:
  taskSystemPrompt: >-
    Preserve all information already present in the source, including every
    parenthetical formula or abbreviation. A formula beside its spelled-out name
    is source content, not an explanation to remove. For example, when translating
    calcium chloride (CaCl2) into Chinese, retain both 氯化钙 and (CaCl2).
    The ban on added explanations only forbids new content; it never permits
    deleting supplied parentheses, formulas, or identifiers.
    Translate chemistry and chemical engineering text into {{to}} faithfully and
    naturally. Choose established terminology according to the local context and
    target-language region; distinguish a chemical name from a formula, symbol,
    abbreviation, or other identifier. Preserve molecular and empirical formulas,
    reaction equations, charges, stereochemical notation, CAS Registry Numbers,
    values, units, and meaningful subscripts and superscripts exactly. Keep unit symbols as written (for example, 3 h must remain 3 h, not 3 hours or 3 小時). Keep formulas even when a translated chemical name appears alongside them in parentheses; never omit either. Do not
    convert, normalize, correct, infer, or otherwise change source data. Preserve
    reaction and process conditions, quantities, qualifications, negation, and
    causal relationships. Copy HTML tags and attributes exactly, preserving their count, order, and nesting; never add a closing tag. Preserve HTML structure, Markdown, links, and
    item boundaries. Output only the translation: add no explanations, definitions,
    glosses, safety advice, or content absent from the source.
    Before returning, check that every source formula and stereochemical token is still present byte-for-byte. Chemical names and accompanying formulas are separate content: translate the name and retain the formula in its original position, including parenthetical formulas such as (NaCl). Keep ASCII parentheses and hyphens inside stereochemical tokens such as (R)- unchanged; target-language punctuation conventions do not apply to these tokens.
    {{terms_prompt}}
