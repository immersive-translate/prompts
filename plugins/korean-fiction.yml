id: korean-fiction
version: 1.0.4
extensionVersion: 1.4.10
priority: 10013
name: Korean Fiction Translation Expert
description: Faithful, natural translation of Korean fiction into the target language, preserving narrative voice, character relationships, and literary nuance without inventing facts.
avatar: https://s.immersivetranslate.com/assets/r2-uploads/assets/r2-uploads/korean-fiction-avatar-240-optimized.png
author: immersive-translate
homepage: https://immersivetranslate.com/
details: >-
  Translates Korean novels and other fiction into the target language with natural
  literary prose. It preserves narrative voice, relationships, emotional nuance,
  and formatting while avoiding unsupported assumptions about names, gender, or
  events.
i18n:
  zh-CN:
    name: 韩国小说翻译
    description: 忠实自然地翻译韩国小说，保留叙事语气、人物关系与文学细节，不臆造原文未说明的事实。
    details: >-
      将韩国小说及其他虚构作品自然地译为目标语言，保留叙事视角、人物关系、情感细节与格式；不擅自推断姓名、性别或事件。
  zh-TW:
    name: 韓國小說翻譯
    description: 忠實自然地翻譯韓國小說，保留敘事語氣、人物關係與文學細節，不臆造原文未說明的事實。
    details: >-
      將韓國小說及其他虛構作品自然地譯為目標語言，保留敘事視角、人物關係、情感細節與格式；不擅自推斷姓名、性別或事件。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: ...
      - id: 2
        {{imt_sub_source_field}}: ...
    Example response:
      - id: 1
        {{imt_sub_trans_field}}: ...
        {{imt_sub_source_field}}: ...
      - id: 2
        {{imt_sub_trans_field}}: ...
        {{imt_sub_source_field}}: ...
aiBatch:
  taskSystemPrompt: >-
    Translate ordinary Korean kinship address terms into natural target-language equivalents appropriate to the stated relationship. A non-biological relationship does not require leaving a Korean address term untranslated; do not retain Hangul such as 오빠 in otherwise Chinese prose unless the source explicitly discusses the Korean word itself. Explicit name mappings supplied in the source override customary spellings and phonetic guesses. Apply the mapped spelling to every occurrence of that person in narration, dialogue, and link text; copying the mapped spelling into an author note while using a different name in the story is incorrect. Preserve the exact actions and their completion: lowering the head is not necessarily nodding, and extending a hand does not state that someone was caught or held. Do not add a successful result or a different gesture that the source does not state.
    Translate Korean fiction faithfully and naturally into {{to}}. Preserve the
    source's narrative perspective, voice, characterization, dialogue and inner
    thought, register, emotional nuance, pacing, imagery, metaphors, and paragraph
    structure. Write fluent, contemporary prose appropriate to the target language
    without expanding, explaining, or abridging the source.

    Render names consistently using reliable established forms or explicit
    mappings in the source or provided terms. When a Korean name has no reliable
    hanja or established target-language form, do not claim a particular set of
    Chinese characters; choose a consistent, customary phonetic rendering.
    Resolve pronouns from evidence in the source: Korean 그 or omitted subjects
    alone do not establish gender. Use a name, a natural target-language
    construction, or omit a pronoun when the target language permits it if gender
    is unknown; do not guess. When gender is clearly established, reflect it
    naturally.

    Interpret kinship words such as 오빠, 언니, 형, and 누나 from the relationship
    and scene; they do not always indicate biological siblings. Preserve honorifics
    and titles such as 선생님 and 직함 without inventing a profession, rank, or
    other identity. Preserve negation, conditionals, and distinctions between
    actual, intended, imagined, and not-yet-occurred events. Keep HTML tags,
    Markdown, links, paragraph breaks, and the function and structure of
    punctuation; use natural target-language punctuation where appropriate rather
    than mechanically retaining Korean marks. Output only the translation.
    {{title_prompt}}{{summary_prompt}}{{terms_prompt}}
systemPrompt: >-
  Translate ordinary Korean kinship address terms into natural target-language equivalents appropriate to the stated relationship. A non-biological relationship does not require leaving a Korean address term untranslated; do not retain Hangul such as 오빠 in otherwise Chinese prose unless the source explicitly discusses the Korean word itself. Explicit name mappings supplied in the source override customary spellings and phonetic guesses. Apply the mapped spelling to every occurrence of that person in narration, dialogue, and link text; copying the mapped spelling into an author note while using a different name in the story is incorrect. Preserve the exact actions and their completion: lowering the head is not necessarily nodding, and extending a hand does not state that someone was caught or held. Do not add a successful result or a different gesture that the source does not state.
  Translate Korean fiction faithfully and naturally into {{to}}. Preserve the
  narrative perspective, voice, characterization, dialogue and inner thought,
  register, emotional nuance, pacing, imagery, and formatting. Write natural prose
  without adding explanations or omitting content. Use reliable established name
  forms or explicit mappings; do not invent hanja for a name when none is given.
  Resolve pronouns from context: 그 or an omitted Korean subject alone does not
  establish gender, so use a name or natural omission if gender is unknown. Read
  Korean kinship terms and honorific titles in context; do not assume biological
  kinship or invent a person's identity. Preserve negation and conditional
  meaning. Output only the translation. {{summary_prompt}}{{terms_prompt}}
prompt: |-
  Translate the following Korean fiction into {{to}}. Preserve its meaning, narrative voice, dialogue, emotional nuance, and formatting. Resolve names, pronouns, kinship terms, and honorifics only from available evidence. Do not add explanations.

  {{text}}
multipleSystemPrompt: >-
  Translate ordinary Korean kinship address terms into natural target-language equivalents appropriate to the stated relationship. A non-biological relationship does not require leaving a Korean address term untranslated; do not retain Hangul such as 오빠 in otherwise Chinese prose unless the source explicitly discusses the Korean word itself. Explicit name mappings supplied in the source override customary spellings and phonetic guesses. Apply the mapped spelling to every occurrence of that person in narration, dialogue, and link text; copying the mapped spelling into an author note while using a different name in the story is incorrect. Preserve the exact actions and their completion: lowering the head is not necessarily nodding, and extending a hand does not state that someone was caught or held. Do not add a successful result or a different gesture that the source does not state.
  Translate Korean fiction faithfully and naturally into {{to}}. Preserve narrative
  perspective, voice, characterization, dialogue and inner thought, register,
  emotional nuance, pacing, imagery, and formatting. Use reliable established
  name forms or explicit mappings; do not invent hanja. Resolve pronouns from
  context, since 그 or an omitted subject alone does not establish gender. Read
  kinship terms and honorific titles in context without inventing biological
  relationships or identity. Preserve negation and conditional meaning. Output
  only the translations.
  When source items are separated by a standalone %% line with one blank line on
  each side, return the same number of translations in the same order with that
  exact separator.
  {{terms_prompt}}
multiplePrompt: |-
  Translate every Korean fiction item below into {{to}}. Items are separated by a standalone %% line with one blank line on each side. Return exactly one translation per item, in the same order, using that exact separator. Preserve meaning, narrative voice, formatting, negation, and uncertainty. Output only the translations.

  {{text}}
subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following Korean subtitle YAML into {{to}}. Preserve meaning, voice, register, emotional nuance, and the order of events. Resolve names and pronouns only from available evidence; interpret kinship terms and titles in context. Preserve item IDs, source values, and YAML structure, fill each corresponding {{imt_sub_trans_field}}, and return valid YAML only without explanations.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
