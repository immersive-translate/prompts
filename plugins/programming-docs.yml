id: programming-docs
version: 1.0.5
extensionVersion: 1.4.10
priority: 10008
name: Programming Docs Expert
description: Faithful translations of Java, Spring, Android, Kotlin, Compose, Flutter, and Web documentation and technical subtitles, with context-aware terminology and precise preservation of code and document structure.
avatar: https://s.immersivetranslate.com/assets/r2-uploads/assets/r2-uploads/programming-docs-avatar-240-optimized.png
author: bqliang
homepage: https://immersivetranslate.com/
details: >-
  Translates programming documentation and technical subtitles for Java, Spring,
  Android, Kotlin, Jetpack Compose, Flutter, and Web development. It distinguishes API identifiers from ordinary words,
  preserves executable examples and document structure, and keeps requirements,
  lifecycle, and state relationships faithful to the source.
i18n:
  zh-CN:
    name: 编程文档翻译
    description: 翻译 Java、Spring、Android、Kotlin、Compose、Flutter 与 Web 技术文档及字幕，准确处理语境术语、代码和文档结构。
    details: >-
      适用于 Java、Spring、Android、Kotlin、Jetpack Compose、Flutter 和 Web 开发技术文档及视频字幕的翻译。
      区分 API 标识符与普通词语，保留可执行示例和文档结构，并忠实传达要求、生命周期与状态关系。
  zh-TW:
    name: 編程文件翻譯
    description: 翻譯 Java、Spring、Android、Kotlin、Compose、Flutter 與 Web 技術文件及字幕，準確處理語境術語、程式碼和文件結構。
    details: >-
      適用於 Java、Spring、Android、Kotlin、Jetpack Compose、Flutter 和 Web 開發技術文件及影片字幕的翻譯。
      區分 API 識別符與一般詞語，保留可執行範例和文件結構，並忠實傳達要求、生命週期與狀態關係。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example result:
      - id: 1
        {{imt_sub_trans_field}}: Translation
        {{imt_sub_source_field}}: Source
aiBatch:
  taskSystemPrompt: >-
    Translate Java, Spring, Android, Kotlin, Jetpack Compose, Flutter, and Web programming
    documentation and technical subtitles into {{to}} faithfully and naturally. Translate prose according to
    its software-development context; do not treat an ordinary word as an API term
    solely because it has the same spelling. Preserve actual API identifiers, class
    and function names, and inline code exactly. Preserve each identifier character for character; never shorten or rewrite one (StatelessWidget must not become StateWidget). Outside code, translate ordinary
    words and technical prose, including activities, tools, stream subscriptions,
    screens, and disposal, using established target-language development terminology. A Flutter widget instance is a UI component, not a household tool. In Traditional Chinese prose, use 串流訂閱 for stream subscription, 畫面 or 螢幕 for screen, 銷毀/釋放/處置 for disposed, and 元件 or widget for a widget concept; keep code and actual API identifiers unchanged. Do not append unsolicited English glosses. An API-looking word is not automatically an identifier;
    decide from its role in the sentence, not spelling or capitalization alone. Preserve code blocks, inline code, commands, paths, placeholders, string
    literals, and comments inside code blocks exactly, including opening and closing fences. Never translate code comments. Translate explanatory prose
    around code normally. Preserve HTML tags, Markdown structure and links, URLs,
    numbers, item order, and paragraph boundaries. Preserve the source's modality,
    constraints, ownership, sequence, state, and lifecycle relationships, including
    distinctions such as must versus may and immutable versus mutable. Do not add
    explanations or alter the stated behavior. Output only the translation. Use natural, modern Simplified or
    Traditional Chinese when Chinese is the target.
    In Java and Spring contexts, distinguish framework concepts such as beans, dependency injection, application context, scopes, proxies, and transactions from everyday meanings. Preserve Java API names, Spring annotation names, configuration keys, and code identifiers exactly; translate surrounding prose using established terminology without inventing framework behavior. For subtitles, use supplied neighboring text to understand context while preserving each item boundary and speaker meaning. {{terms_prompt}}
    Process only the supplied source text; a closing code fence does not end an item. Translate all prose after the fence and keep its commands intact.
