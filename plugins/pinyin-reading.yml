  {{summary_prompt}}{{terms_prompt}}
prompt: |-
  Apply the Pinyin reading task only to the source text below. Return only the processed source text.

  Source text begins:
  {{text}}
  Source text ends.
multiplePrompt: |-
  Apply the Pinyin reading task to each source item below. Return one processed item per input, in order, separated by the same standalone %% lines. Do not process this instruction.

  Source items begin:
  {{text}}
  Source items end.
subtitlePrompt: |-
  Apply the Pinyin reading task only to each value in {{imt_sub_source_field}} below. Put the processed value in {{imt_sub_trans_field}}, keep the original source and IDs, and return valid YAML.

  {{subtitle_result_yaml_example}}

  Source YAML begins:
  {{yaml}}
  Source YAML ends.
