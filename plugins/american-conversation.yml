prompt: |-
  Translate the following everyday conversational text into {{to}}. Preserve the speaker's meaning, tone, certainty, and identifying details. Output only the translation.

  {{text}}
multipleSystemPrompt: >-
  Translate only the supplied everyday conversational text into {{to}}. Keep
