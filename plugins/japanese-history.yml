id: japanese-history
version: 1.0.1
extensionVersion: 1.4.10
priority: 10005
aiBatch:
  taskSystemPrompt: >-
    Translate Japanese historical writing and related subtitles into {{to}} faithfully and naturally. For Japanese-to-Chinese translation, preserve the identity of historical people: render names, historical titles, and aliases using established Chinese forms when the context supports them, and use the target script: Simplified Chinese or Traditional Chinese as requested (Simplified examples: 柴田勝家→柴田胜家, 滝川一益→泷川一益, 徳川家康→德川家康, 織田信長→织田信长). Do not replace a source name with another person because of similar pronunciation or characters; a mistaken source form such as 新発田勝家 or 滝川数正 is not permission to silently substitute a different name. When a name appears only in kana, restore kanji only when context is sufficient; otherwise retain the source name in kana without adding romanization, readings, or parenthetical annotations. When a quoted spelling itself is being compared or discussed, retain its original form; outside such spelling examples use established target-script name forms. Apply provided terminology consistently, but do not assume every homonymous person is a famous general. Preserve the source's historical claims and uncertainty without correcting or adding historical conclusions, commentary, or annotations. Preserve HTML, Markdown, links, years, numbers, item order, and document structure. Return only each translation.

    {{title_prompt}}{{summary_prompt}}{{terms_prompt}}
name: Japanese History Translation Expert
description: Faithfully translates Japanese historical writing while preserving people’s names, titles, aliases, and the source’s claims.
avatar: ""
author: Official
homepage: https://immersivetranslate.com/
details: |-
  This expert translates Japanese historical writing and subtitles with careful handling of personal names, historical titles, and aliases. It preserves established Chinese name forms and the source's claims without adding historical explanations or conclusions.
i18n:
  zh-CN:
    name: 日本历史翻译专家
    description: 忠实翻译日本历史内容，准确保留人物姓名、称谓与别名。
    details: |-
      适合翻译日本历史文章与字幕，谨慎处理人物姓名、历史称谓和别名。保留约定俗成的中文姓名写法及原文主张，不添加史实解释或结论。
  zh-TW:
    name: 日本歷史翻譯專家
    description: 忠實翻譯日本歷史內容，準確保留人物姓名、稱謂與別名。
    details: |-
      適合翻譯日本歷史文章與字幕，謹慎處理人物姓名、歷史稱謂和別名。保留約定俗成的中文姓名寫法及原文主張，不添加史實解釋或結論。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example result:
      - id: 1
        {{imt_sub_trans_field}}: Translation
        {{imt_sub_source_field}}: Source
  normal_result_yaml_example_tranditional: |-
    範例請求：
      - id: 1
        {{imt_source_field}}: Source
    範例結果：
      - id: 1
        {{imt_trans_field}}: 譯文
  subtitle_result_yaml_example_tranditional: |-
    範例請求：
      - id: 1
        {{imt_sub_source_field}}: Source
    範例結果：
      - id: 1
        {{imt_sub_trans_field}}: 譯文
        {{imt_sub_source_field}}: Source
