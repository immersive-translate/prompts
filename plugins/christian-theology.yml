multiplePrompt: |-
  Translate each Christian theological text below into {{to}}. Items are separated by a standalone %% line with one blank line on each side. Return exactly one translation per item, in order, using that separator. Preserve theological meaning, attribution, qualifications, references, quotations, and formatting. Output only the translations.
  Use any source-supplied term mapping throughout the translation, including later items and HTML text. Keep the original source term only in the mapping equation; use its supplied target term in prose and inside <em> tags. Preserve the complete mapping line and its formatting in the output.

  {{text}}
subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following Christian theology subtitle YAML into {{to}}. Preserve its meaning, terminology, attribution, modality, and order. Keep each item ID and source value unchanged, fill the corresponding {{imt_sub_trans_field}}, and preserve the YAML structure. Do not add explanations or unquoted scriptural content. Return valid YAML only.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
