multiplePrompt: |-
  Translate every source item below into {{to}}. Return exactly one translation for each item in the same order. Preserve terminology, classifications, numbers, units, identifiers, conditions, and formatting, using the exact standalone %% separator between items. Keep each numeric quantity, unit symbol, and element symbol exactly as written; do not translate or convert these data tokens. Output only the translations.

  {{text}}
subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following YAML subtitles into {{to}}. Preserve mining terminology, classifications, numbers, units, identifiers, conditions, formatting, item IDs, source fields, and order; fill the corresponding {{imt_sub_trans_field}}. Return valid YAML only.

  {{subtitle_result_yaml_example}}

  Start:

