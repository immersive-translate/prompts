# 自动检查仅覆盖保留的词面/结构约束；专业语义与附注限制见 reviewCriteria。
# 按用户要求调整自动门槛；GLM tag=標記 仍是已知误译，不代表质量验收通过。
expertId: basketball
cases:
  - id: en-zh-CN-tactics
    name: 英译简中：挡拆、外弹与弱侧协防（基础自动检查）
    from: en
    to: zh-CN
    items:
      - source: Chen sets a screen for Rivera, then rolls to the rim. The defense switches rather than traps the ball handler.
        mustContainAny:
          - [Chen, 陈]
          - [Rivera, 里维拉, 里韦拉, 里弗拉]
          - [掩护, 挡拆]
          - [顺下, 切入, 切向, 篮下]
          - [换防, 交换防守]
          - [包夹, 夹击]
      - source: On the next possession, Chen runs a pick-and-pop and stays outside the paint instead of rolling to the basket.
        mustContainAny:
          - [Chen, 陈]
          - [外弹, 外拆, 外拉]
          - [禁区, 油漆区, 三秒区, 外线, 外围]
        mustNotContain: [油漆涂料, 三分线外, 超过三分线]
      - source: The weak-side defender tags the roller, then recovers to the corner shooter without conceding an open three.
        mustContainAny:
          - [弱侧]
          - [底角, 角落]
          - [三分]
    reviewCriteria:
      - 自动绿灯仅表示本用例保留的词面与结构检查通过；tag 的短暂协防含义、底角专业表达和不附英文解释仍须人工评审，未评审不能判质量合格。
      - 已知风险：GLM 繁中可能将 tag 译为標記，这是实际误译；本次按用户要求转人工检查，自动绿灯不表示该错误已修复。
      - 掩护、顺下与外弹是否区分准确，换防是否被误译为包夹；不得改变否定关系。
      - 弱侧防守者先协防顺下者再回位的顺序、目的与没有放出空位三分的关系是否完整；不得补写出手或命中。
      - tag 须表达临时协防阻挡顺下者或传球路线，不能仅写跟防；不添加协防(Tag)或Tag(协防)等任一顺序的双语解释。
      - 与同文本 common 相比，战术译法是否自然、专业，避免字面翻译 paint 或 tag；corner shooter 应采用底角射手，角落写法主要按专业表达审校，与新增位置事实分开判断。
      - 外线或外围措辞可供审校，但仍须保留禁区外的范围，不能推定站在三分线外；标记不是本条 tag 的协防动作。

  - id: en-zh-CN-facts
    name: 英译简中：比分方向、数据与人物身份（基础自动检查）
    from: en
    to: zh-CN
    items:
      - source: With 12 seconds left in the fourth quarter, the Comets have 96 points and their opponents have 98; the Comets trail by two. Rivera kicks it out to Chen for a potential game-winning three.
        mustPreserve: ["98", "96", "12"]
        mustContainAny:
          - [Comets, 彗星]
          - [Rivera, 里维拉, 里韦拉, 里弗拉]
          - [Chen, 陈]
          - [落后]
          - [第四节, 第4节, 第４节, 末节]
        mustMatch:
          - '(?:96\s*(?:比|[–—−－:：-])\s*98|(?:Comets|彗星)[^\d。！？\n]{0,12}96\s*分)'
          - '(?:96\s*(?:比|[–—−－:：-])\s*98|对手[^\d。！？\n]{0,12}98\s*分)'
          - '(?:(?:可能|有机会|有機會|有望|可望|或许|或許|可以|能够|能夠|能|准备|準備|尝试|嘗試|寻求|尋求|争取|爭取|希望|若|如果|假如|一旦|只要)|(?:投[进進中]|命中|射[进進])(?!了)[^。！？；;\n]{0,12}(?:就|便|才|则|則|的话|的話))'
          - '^(?![\s\S]*(?:^|[。！？；;\n])(?!(?:(?!(?:投[进進中]|命中|射[进進]))[^\n。！？；;])*(?:可能|有机会|有機會|有望|可望|或许|或許|可以|能够|能夠|能|准备|準備|尝试|嘗試|寻求|尋求|争取|爭取|希望|若|如果|假如|一旦|只要))[^\n。！？；;]*(?!(?:投[进進中]|命中|射[进進])(?!了)[^。！？；;\n]{0,12}(?:就|便|才|则|則|的话|的話))(?:投[进進中]|命中|射[进進]))'
        mustNotContain: [踢, 底角, 底线外, 底線外, 边线外, 邊線外, 界外]
      - source: 'Chen: PTS 24, REB 8, AST 11, TOV 3, TS% 62.5%, +/- -7. His team leads the series 2–1, but lost this game: his team scored 99 points and the opponents scored 101.'
        mustPreserve: ["24", "8", "11", "3", "62.5", "2", "1", "101", "99"]
        mustContainAny:
          - [Chen, 陈]
        mustMatch:
          - '(?:(?:PTS|得分)[^\d]{0,12}24(?!\d)|24\s*(?:分|得分))'
          - '(?:(?:REB|篮板)[^\d]{0,12}8(?!\d)|8\s*(?:个\s*)?篮板)'
          - '(?:(?:AST|助攻)[^\d]{0,12}11(?!\d)|11\s*(?:次\s*)?助攻)'
          - '(?:(?:TOV|失误)[^\d]{0,12}3(?!\d)|3\s*(?:次\s*)?失误)'
          - '(?:TS%|真实(?:投篮)?命中率)[^\d]{0,12}62\.5\s*[%％]'
          - '(?:\+/[-−－–]|正负值)[^\d+\-−－–]{0,12}(?:[-−－–]|负)\s*7(?!\d|\.\d)'
      - source: Jordan Lee boxes out, and Lee secures the rebound. Jordan is still on the bench.
        mustContainAny:
          - [卡位, 挡住]
          - [篮板]
          - [替补席, 板凳席, 替补区, 板凳区, 板凳]
        mustMatch:
          - '(?:Jordan Lee|乔丹[·・\s]*李|乔登[·・\s]*李)[\s\S]*(?:Lee|李)[\s\S]*(?:Jordan|乔丹|乔登)'
        mustNotContain: [Michael, 迈克尔, 公牛, 长椅, 長椅, 长凳, 長凳]
      - source: Rivera passes to Chen, who is standing at the three-point line. Chen has not taken a shot yet; the game is still in progress.
        mustContainAny:
          - [Rivera, 里维拉, 里韦拉, 里弗拉]
          - [Chen, 陈]
          - [三分]
        mustMatch:
          - '(?:尚未|还未|还没|还没有|未曾|没有|未)[^。！？\n]{0,12}(?:出手|投篮|投出|投球)'
        mustNotContain: [三分线外, 三分线内, 三分線外, 三分線內]
    reviewCriteria:
      - 自动绿灯仅表示本用例保留的词面与结构检查通过；不附英文术语解释、完整动作关系及潜在出手阶段仍须人工评审，未评审不能判质量合格。
      - 必须仍为 Comets 落后且比赛未结束；传球后的潜在致胜三分不能被补写为已经命中或赢球。
      - Comets 得 96 分、对手得 98 分，必须落后两分；检查分数与双方的对应关系，不能仅检查数字存在。
      - 数据标签允许保留英文或准确本地化，但各项数值与负号须对应；球队本场得 99 分、对手 101 分，不能与系列赛领先混同。
      - 姓名可以一致音译，但不能将 Jordan 认定为 Michael Jordan，不能擅自合并 Jordan Lee、Lee 和 Jordan 的身份；卡位与拿到篮板不能混同。
      - 传球寻求潜在制胜三分不等于已经出手；新增明确未出手条目须保留 Chen 尚未投篮及比赛仍在进行。
      - kicks it out 在此为传球给 Chen，不能译成用脚踢；三分线上的位置不能变成三分线外。姓名分隔符不决定身份，须逐一核对卡位者、取得篮板者与替补席上的人。
      - 潜在致胜三分条目没有底角位置，不得由分球或三分推断底角；逐次保留姓名及动作归属，不得漏掉 Rivera 或误拼为 Riverra。
      - 不添加原文没有的 kick-out 等英文括号注释；三分线上不能变成线内或线外。
      - 潜在致胜球须保留机会或条件；有机会投进、若投进、投进就能赢均可，不能写成已投进。不得新增底线外、边线外等位置；box-out 双语括号也不得新增。
      - 人物卡位和篮板条目中的 bench 仍是篮球替补席，即使没有 team 修饰也不能译成长椅；独立姓名和动作主体必须保留。

  - id: en-zh-CN-context
    name: 英译简中：篮球习语、普通语义与格式
    from: en
    to: zh-CN
    items:
      - source: '<a href="https://example.com/play?id=7">Rivera</a> hit a shot from downtown, but his next attempt was an air ball. **Not a turnover.**'
        mustPreserve: ['<a href="https://example.com/play?id=7">', '</a>', '**']
        mustContainAny:
          - [Rivera, 里维拉, 里韦拉, 里弗拉]
          - [三分]
          - [三不沾, 三不粘, 篮外空心, 没有碰到, 没碰到]
          - [失误]
        mustNotContain: [市中心, 空气球, 面包, 麵包]
      - source: The editor checked the screen, painted the bench, and discussed staff turnover downtown. Keep `{{player_id}}` unchanged.
        mustPreserve: ['`{{player_id}}`']
        mustContainAny:
          - [长凳, 长椅, 板凳, 凳子, 木凳]
          - [员工, 人员, 职员, 人事]
          - [编辑, 编者]
          - [市中心, 市区, 城区, 闹市区, 城中心, 城中, 市内]
        mustMatch:
          - '(?:[刷漆涂塗喷噴]|上色|彩[绘繪])'
        mustNotContain: [挡拆, 换防, 三分, 球员流失, 失误, 替补席, 板凳席, 板凳区, 禁区, 禁區, 人墙, 人牆]
      - source: The librarian repainted a wooden bench beside the reading-room window and checked the computer display. Staff turnover at the library stayed low.
        mustContainAny:
          - [长凳, 长椅, 板凳, 凳子, 木凳]
          - [员工, 人员, 职员, 人事]
          - [屏幕, 显示屏, 显示器]
        mustNotContain: [掩护, 挡拆, 换防, 失误, 替补席, 板凳席, 板凳区]
      - source: Rivera returned to the team's bench after a turnover. A substitute was waiting to enter the game.
        mustContainAny:
          - [Rivera, 里维拉, 里韦拉, 里弗拉]
          - [替补席, 板凳席, 板凳, 替补区]
          - [替补, 候补]
          - [失误]
      - source: In the park, a child kicked a football to a friend with the right foot.
        mustContainAny:
          - [足球]
          - [踢, 右脚, 右足]
    reviewCriteria:
      - downtown 必须保留三分属性，不能只写远投；air ball 与 turnover 按篮球语境处理，保留第二次出手未命中与不是失误的否定关系。
      - 非篮球文本是否仍指屏幕、长凳、员工流动和市中心，不能因专家身份强套篮球术语。
      - 同批图书馆木制长凳与球队替补席须按各自语境判断；图书馆低人员流动不能变成低球权失误，等待上场不能变成已经上场。
      - 链接目标、标签、加粗标记与占位符是否完整；专业性不能以损害语义或格式为代价。
      - 每条日常文字也须翻成简体中文，不得原样返回英文；电脑显示屏不是展陈。公园足球条目是用右脚踢球，不能因 kick-out 规则改成篮球手传。
      - 简中 airball 使用三不沾或准确等义描述，不能借用繁中面包用语；木凳可进入人工长度精度审校。
      - 日常条目须保留编辑检查屏幕、刷漆与市中心的含义，不得添加禁区或人墙；日常板凳不能写成板凳席，不能借板凳子串通过席位误译。

