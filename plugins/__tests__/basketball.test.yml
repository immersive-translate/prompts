      - 姓名可一致音譯，但不能把 Jordan 猜成 Michael Jordan，不能擅自合併全名與短名的身分；卡位與取得籃板須區分。
      - 傳球尋求潛在致勝三分不等於已經出手；新增明確未出手條目須保留 Chen 尚未投籃及比賽仍在進行。
      - kicks it out 在此為傳球給 Chen，不能譯成用腳踢；三分線上的位置不能變成三分線外。姓名分隔符不決定身分，須逐一核對卡位者、取得籃板者與板凳上的人。
      - 潛在致勝三分條目沒有底角位置，不得由分球或三分推斷底角；逐次保留姓名及動作歸屬，不得漏掉 Rivera 或誤拼為 Riverra。
      - 不添加原文沒有的 kick-out 等英文括號註釋；三分線上不能變成線內或線外。
      - 潛在致勝球須保留機會或條件；有機會投進、若投進、投進就能贏均可，不能寫成已投進。不得新增底線外、邊線外等位置；box-out 雙語括號也不得新增。
      - 人物卡位和籃板條目中的 bench 仍是籃球替補席，即使沒有 team 修飾也不能譯成長椅；獨立姓名和動作主體必須保留。

  - id: en-zh-TW-context
    name: 英译繁中：慣用語、日常語義與格式
    from: en
    to: zh-TW
    items:
      - source: '<a href="https://example.com/play?id=7">Rivera</a> hit a shot from downtown, but his next attempt was an air ball. **Not a turnover.**'
        mustPreserve: ['<a href="https://example.com/play?id=7">', '</a>', '**']
        mustContainAny:
          - [Rivera, 里維拉, 里韋拉, 李維拉, 李韋拉]
          - [三分]
          - [麵包, 三不沾, 三不粘, 籃外空心, 沒有碰到, 沒碰到]
          - [失誤]
        mustNotContain: [市中心, 空氣球]
      - source: The editor checked the screen, painted the bench, and discussed staff turnover downtown. Keep `{{player_id}}` unchanged.
        mustPreserve: ['`{{player_id}}`']
        mustContainAny:
          - [長凳, 長椅, 板凳, 凳子, 木凳]
          - [員工, 人員, 職員, 人事]
          - [編輯, 編者]
          - [市中心, 市區, 城區, 鬧市區, 城中心, 城中, 市內]
        mustMatch:
          - '(?:[刷漆涂塗喷噴]|上色|彩[绘繪])'
        mustNotContain: [擋拆, 換防, 三分, 球員流失, 失誤, 替補席, 板凳席, 板凳區, 禁區, 禁区, 人牆, 人墙]
      - source: The librarian repainted a wooden bench beside the reading-room window and checked the computer display. Staff turnover at the library stayed low.
        mustContainAny:
          - [長凳, 長椅, 板凳, 凳子, 木凳]
          - [員工, 人員, 職員, 人事]
          - [螢幕, 顯示器, 顯示屏]
        mustNotContain: [掩護, 擋拆, 換防, 失誤, 替補席, 板凳席, 板凳區]
      - source: Rivera returned to the team's bench after a turnover. A substitute was waiting to enter the game.
        mustContainAny:
          - [Rivera, 里維拉, 里韋拉, 李維拉, 李韋拉]
          - [板凳, 替補席, 替補區]
          - [替補, 候補]
          - [失誤]
      - source: In the park, a child kicked a football to a friend with the right foot.
        mustContainAny:
          - [足球]
          - [踢, 右腳, 右足]
    reviewCriteria:
      - downtown 必須保留三分屬性，不能只寫遠投；air ball 允許麵包、籃外空心等自然說法，須保留未命中與不是失誤的區別。
      - 非籃球內容是否忠實採用螢幕、長凳、員工流動和市中心等日常語義。
      - 同批圖書館木製長凳與球隊板凳席須採各自詞義；圖書館低人員流動不能變成低球權失誤，等待上場不能變成已上場。
      - HTML 連結、Markdown 和占位符是否完整；與 common 相比不得出現語義或格式退步。
      - 每條日常文字也須翻成繁體中文，不得原樣返回英文；電腦顯示屏不是展陳。公園足球條目是用右腳踢球，不能因 kick-out 規則改成籃球手傳。
      - 日常條目須保留編輯檢查螢幕、刷漆與市中心的含義，不得添加禁區或人牆；日常板凳不能寫成板凳席，不能借板凳子串通過席位誤譯；木凳可進入人工長度精度審校。

  - id: zh-CN-en-tactics
    name: 中译英：挡拆战术与攻防关系
    from: zh-CN
    to: en
    items:
      - source: Chen 给 Rivera 做掩护后顺下，防守方选择换防，而不是包夹持球人。
        mustPreserve: [Chen, Rivera]
        mustMatch:
          - '(?:[Ss]creen|[Pp]ick)'
          - '(?:[Rr]oll|[Dd]iv(?:e|es|ing))'
          - '[Ss]witch'
          - '(?:[Tt]rap|[Dd]ouble(?:[- ]team)?)'
      - source: 下一回合，Chen 挡拆后外弹，留在禁区外，并没有顺下到篮下。
        mustPreserve: [Chen]
        mustMatch:
          - '(?:[Pp]ick[- ]and[- ]pop|[Pp]op(?:s|ped|ping)? (?:out|to|after (?:a |the )?(?:screen|pick|ball screen)))'
          - '(?:[Pp]aint|[Kk]ey|[Ll]ane|[Pp]erimeter)'
          - '(?:(?:[Ii]nstead of|[Rr]ather than|[Ww]ithout)[^.?!]{0,20}(?:roll|cut)|(?:[Nn]ot|[Nn]ever)[^.?!]{0,35}(?:roll|cut))'
      - source: 弱侧防守人先协防顺下球员，再回到底角射手身边，没有漏掉空位三分。
        mustMatch:
          - '[Ww]eak[- ]?side'
          - '[Cc]orner'
          - '[Tt]hree'
    reviewCriteria:
      - screen、roll、pick-and-pop、switch 和 trap/double-team 是否自然准确；pop 可有不同句式，但不能误写为先顺下再外弹，也不能反转否定关系。
      - weak-side help 与回位的主语、顺序和目的是否保留；没有放出空位三分应自然表达为不给空位三分机会，不能只机械写 did not leave the open three。
      - perimeter 可为自然外围表达，但须审校禁区外的范围，不能添加 beyond the three-point line；不得改变原文站位。

  - id: zh-CN-en-facts
    name: 中译英：比分、统计与未确定赛果
    from: zh-CN
    to: en
    items:
      - source: 第四节还剩 12 秒，Comets 以 96–98 落后。Rivera 突破分球给 Chen，后者准备投出可能反超比分的三分球。
        mustPreserve: [Comets, Rivera, Chen, "96", "98", "12"]
        mustMatch:
          - '(?:[Tt]rail|[Bb]ehind|[Dd]own)'
          - '(?:[Ff]ourth|4th) (?:quarter|period)'
          - '^(?![\s\S]*\b[Gg]ame[- ]winning\b)'
      - source: 'Chen 的数据：PTS 24、REB 8、AST 11、TOV 3、TS% 62.5%、+/- -7。球队系列赛 2–1 领先，但本场 99–101 输球。'
        mustPreserve: [Chen, "24", "8", "11", "3", "62.5", "2", "1", "99", "101"]
        mustMatch:
          - '(?:(?:PTS|[Pp]oints)\s*[:=]?\s*24(?!\d|\.\d)|(?<![\d.+\-−－–])24\s+(?:PTS|[Pp]oints)\b)'
          - '(?:(?:REB|[Rr]ebounds)\s*[:=]?\s*8(?!\d|\.\d)|(?<![\d.+\-−－–])8\s+(?:REB|[Rr]ebounds)\b)'
          - '(?:(?:AST|[Aa]ssists)\s*[:=]?\s*11(?!\d|\.\d)|(?<![\d.+\-−－–])11\s+(?:AST|[Aa]ssists)\b)'
          - '(?:(?:TOV|[Tt]urnovers)\s*[:=]?\s*3(?!\d|\.\d)|(?<![\d.+\-−－–])3\s+(?:TOV|[Tt]urnovers)\b)'
          - '(?:(?:TS%?|[Tt]rue[- ]shooting(?: percentage| rate)?)\s*[:=]?\s*62\.5\s*[%％]|(?<![\d.+\-−－–])62\.5\s*[%％]\s*(?:TS%?|[Tt]rue[- ]shooting(?: percentage| rate)?))'
          - '(?:(?:\+/[-−－–]|[Pp]lus[-/ –−－]minus)\s*[:=]?\s*(?:(?:of|was|is)\s+)?[-−－–]\s*7(?!\d|\.\d)|(?<![\d.+\-−－–])[-−－–]\s*7\s*(?:\+/[-−－–]|[Pp]lus[-/ –−－]minus))'
      - source: Jordan Lee 负责卡位，Lee 拿到篮板。Jordan 仍坐在替补席上。
        mustPreserve: [Jordan Lee]
        mustMatch:
          - '\bJordan Lee\b[\s\S]*\bLee\b[\s\S]*\bJordan\b'
          - '\b[Bb]ox(?:es|ed|ing)?[- ]out\b'
          - '[Rr]ebound'
          - '\b[Bb]ench\b'
        mustNotContain: [Michael, Bulls, on the substitutes, on substitutes]
      - source: Alex Chen 负责卡位，Morgan Wu 拿到篮板。Taylor 仍坐在替补席上。
        mustPreserve: [Alex Chen, Morgan Wu, Taylor]
        mustMatch:
          - '\b[Bb]ox(?:es|ed|ing)?[- ]out\b'
          - '[Rr]ebound'
          - '[Bb]ench'
        mustNotContain: [on the substitutes, on substitutes]
    reviewCriteria:
      - 第四节、落后方与剩余时间是否正确；Chen 只是准备出手，不能补写投篮命中或已反超。
      - 统计标签允许完整名称或缩写，数值在前或在后均可，但数值、百分比和正负号必须对应；系列赛领先与本场失利须区分，不能变成 per-game 数据。
      - 不扩写 Jordan 的身份；卡位和得到篮板的动作主语须保持原文关系。
      - 不能用 Jordan Lee 中的 Lee 子串代替原文另一次 Lee 提及；即使姓名词面都保留，也须检查每个动作的主语。新增 Alex Chen、Morgan Wu、Taylor 对照不得合并、交换卡位者与篮板获得者。
      - 可能反超比分不能升级为制胜或绝杀，即使保留 potential 也不等义；box-out 名词和 box out 动词形式均可，仍须核对动作主语。
      - 坐在替补席须为 on the bench 等席位表达，不能写成坐在替补球员身上；普通长椅同样不能泛化为 furniture。

  - id: zh-CN-en-context
    name: 中译英：习语、普通语义与格式
    from: zh-CN
    to: en
    items:
      - source: '<a href="https://example.com/play?id=7">Rivera</a> 投进一记三分球，但下一次出手是三不沾。**这不是失误。**'
        mustPreserve: [Rivera, '<a href="https://example.com/play?id=7">', '</a>', '**']
        mustMatch:
          - '(?:[Tt]hree[- ]pointer|[Tt]hree|[Bb]eyond the arc|\b[Dd]owntown\b)'
          - '(?:[Aa]ir ?ball|[Hh]it neither (?:the )?rim nor (?:the )?backboard|[Mm]iss(?:ed|es|ing)? (?:both )?(?:the )?rim and (?:the )?backboard)'
          - '[Tt]urnover'
      - source: 编辑检查屏幕、给长凳刷漆，并在市中心讨论员工流动。保留 `{{player_id}}` 不变。
        mustPreserve: ['`{{player_id}}`']
        mustMatch:
          - '(?:[Ss]taff|[Ee]mployee|[Pp]ersonnel|[Ww]orkforce)'
          - '(?:[Dd]owntown|[Cc]ity cent(?:er|re))'
          - '\b[Ee]ditors?\b'
          - '\b[Bb]ench(?:es)?\b'
          - '(?:[Ss]creen|[Dd]isplay|[Mm]onitor)'
        mustNotContain: [pick-and-roll, pick-and-pop, three-pointer]
    reviewCriteria:
      - 三分球和三不沾是否采用自然篮球英语；不能误称 block，也不能丢掉不是失误的否定关系。
      - 普通文本的 screen、bench、turnover 和 downtown 是否仍为日常语义，保留格式和占位符。
      - 编辑是检查屏幕和刷漆的人，不能改为 Edit the screen 等命令句；downtown 在本组篮球句中可表示三分，在普通句中仍为市中心。

  - id: zh-TW-en-terminology
    name: 繁中译英：本地术语与数值
    from: zh-TW
    to: en
    items:
      - source: Chen 擋拆後外彈出手，但投了麵包；Rivera 卡位後抓下進攻籃板。
        mustPreserve: [Chen, Rivera]
        mustMatch:
          - '(?:[Pp]ick[- ]and[- ]pop|[Pp]op(?:s|ped|ping)? (?:out|to|after (?:a |the )?(?:screen|pick|ball screen))|[Pp]opped and shot|[Pp]opping on (?:the )?pick[- ]and[- ]roll)'
          - '(?:[Mm]issed everything\b|[Aa]ir ?ball|[Hh]it neither (?:the )?rim nor (?:the )?backboard|[Mm]iss(?:ed|es|ing)? (?:both )?(?:the )?rim and (?:the )?backboard)'
          - '[Oo]ffensive (?:rebound|board)'
          - '^(?![\s\S]*\b(?:[Tt]hree(?:[- ](?:point(?:er)?|pointer))?|3[- ]?point(?:er)?|[Dd]owntown|[Bb]eyond the arc)\b)'
        mustNotContain: [bread, toast]
      - source: Rivera 全場送出 11 次助攻、發生 3 次失誤，正負值為 -7，並非每場平均數據。
        mustPreserve: [Rivera, "11", "3"]
        mustMatch:
          - '[Aa]ssist'
          - '[Tt]urnover'
          - '(?:(?:\+/[-−－–]|[Pp]lus[-/ –−－]minus)\s*[:=]?\s*(?:(?:of|was|is)\s+)?[-−－–]\s*7(?!\d|\.\d)|(?<![\d.+\-−－–])[-−－–]\s*7\s*(?:\+/[-−－–]|[Pp]lus[-/ –−－]minus))'
          - '(?:[Pp]er[- ]game (?:averages?|stats|statistics|figures|data)|averages? (?:per|for each) game)'
          - '(?:[Nn]ot|[Ii]nstead of|[Rr]ather than)[^.?!]{0,30}(?:per[- ]game|for each game)'
        mustNotContain: [season, Season]
      - source: Chen 投了麵包，球完全沒碰到框或板；Rivera 下一次出手打鐵，球砸到籃框後彈出。
        mustPreserve: [Chen, Rivera]
        mustMatch:
          - '(?:[Aa]ir ?ball|[Hh]it neither (?:the )?rim nor (?:the )?backboard|[Mm]iss(?:ed|es|ing)? (?:both )?(?:the )?rim and (?:the )?backboard)'
          - '(?:[Bb]rick|(?:[Hh]it|[Bb]ounc(?:ed|es|ing)|[Cc]lang(?:ed|s|ing)|[Rr]attl(?:ed|es))[^.?!]{0,25}(?:rim|iron)|(?:rim|iron)[^.?!]{0,25}[Bb]ounc(?:ed|es|ing)[^.?!]{0,12}(?:out|off|away))'
      - source: 麵包店的店員坐在木製長凳上吃麵包，並查看螢幕上的排班表。
        mustMatch:
          - '[Bb]read'
          - '[Bb]ench'
          - '(?:[Ss]creen|[Dd]isplay|[Mm]onitor)'
        mustNotContain: [airball, air ball, three-pointer, pick-and-roll, pick-and-pop]
    reviewCriteria:
      - 籃球麵包須保留 airball 完全沒碰框或板的含義，允許等義描述，不能僅用 brick、missed badly 或 missed the shot completely 等一般投失；擋拆外彈、卡位與進攻籃板的主體及順序須保留。
      - 助攻、失誤和正負值是否正確，單場數據不能變成場均，對照 common 確認收益。
      - 對照條目中 Chen 的麵包與 Rivera 碰框彈出的打鐵須區分，不能把兩次都譯成 airball 或一般投失。
      - 麵包店的麵包仍為食物，長凳與螢幕為日常物件，不能受同批籃球條目污染。
      - “并非每场平均数据”的每场及否定限定须完整保留，不能替换成未给出的 season averages；负号可为 Unicode 等义符号，但不能丢失或变成正七。
      - 碰框彈出允許 rattled the rim、rim then bounced out 等等義描述；仍需核對是 Rivera 的球，不能把 Chen 的麵包也改成碰框。
      - 首條單次出手的 missed everything 可表達麵包；不能放寬為 missed badly 或一般投失，仍須核對動作主體。
      - 首條外彈出手未指定三分，不得加 three、3-point、downtown 或 beyond the arc；仍須保留投籃與麵包，不能把擋拆外彈寫成先順下再外彈。
      - 本條外彈允許 popped and shot、popping on the pick-and-roll 等動詞句式；仍須核對人物、出手、麵包及進攻籃板，不因句式通過就認定所有戰術順序與自然度正確。
