id: traditional-cantonese
version: 1.0.0
extensionVersion: 1.4.10
priority: 42
name: Traditional & Cantonese Converter
description: Converts Traditional Chinese and Cantonese copy into standard written Chinese, then translates it in the house style of the Chinese editions of BBC, The Wall Street Journal, The Financial Times, The New York Times and The Economist.
avatar: https://s.immersivetranslate.com/assets/uploads/news-nW0qbs.png
author: happycooltony
homepage: https://github.com/happycooltony
details: |-
  This expert turns Traditional Chinese and Cantonese copy into publishable standard written Chinese. Cantonese-only characters and grammar (嘅、咗、啲、喺、嗰、唔、佢), Hong Kong flavoured vocabulary and Traditional characters are normalized rather than transcribed, one-to-many character mappings are resolved against the Table of General Standard Chinese Characters, and Traditional punctuation is converted, so the result reads as if it was written in Simplified Chinese from the start.

  It is direction aware: Simplified Chinese sources go out into {{to}}; every other source language, including Traditional Chinese and Cantonese, comes into Simplified Chinese — and when the copy is news or current affairs, it is edited to news-desk register as well: verbs over nominalisations, figures placed early, no empty hedges, full name and title on first mention, Hong Kong political and business idiom kept where it is standard in Chinese news copy.

  Suited to Hong Kong and Taiwan media copy, Cantonese social posts and interviews, court and legislative reporting, policy papers and press releases, and any Traditional or Cantonese text that has to be turned into clean Simplified Chinese.
i18n:
  zh-CN:
    name: 繁体粤语转换大师
    description: 把繁体中文、粤语口语稿件转成标准书面中文（简体），并按 BBC、《华尔街日报》《金融时报》《纽约时报》《经济学人》中文版的新闻文体译出。
    details: |-
      该专家专做繁体与粤语的转换：粤语特有字形与语法（嘅、咗、啲、喺、唔、佢）、港式词汇、繁体字一律归一为标准现代书面中文，不作方言转写；繁简一对多映射按《通用规范汉字表》处理，繁体标点同步转换。转出来的稿子读起来就像是直接用简体中文写成的。

      方向自适应：简体中文源译为 {{to}}；繁体中文、粤语及其他任何源语言一律译为简体中文。稿件属新闻时事类时，还会套用新闻文体规范——多用动词、数字前置、不用空泛模糊语、首次出现给全名与职衔、保留中文新闻惯用的香港政经用语。

      适合港台媒体稿件、粤语社交帖文与访谈、法庭与立法会报道、政策文件与新闻公报，以及任何需要转成干净简体中文的繁体、粤语文本。
  zh-TW:
    name: 繁體粵語轉換大師
    description: 把繁體中文、粵語口語稿件轉成標準書面中文（簡體），並按 BBC、《華爾街日報》《金融時報》《紐約時報》《經濟學人》中文版的新聞文體譯出。
    details: |-
      該專家專做繁體與粵語的轉換：粵語特有字形與語法（嘅、咗、啲、喺、唔、佢）、港式詞彙、繁體字一律歸一為標準現代書面中文，不作方言轉寫；繁簡一對多映射按《通用規範漢字表》處理，繁體標點同步轉換。轉出來的稿子讀起來就像是直接用簡體中文寫成的。

      方向自適應：簡體中文源譯為 {{to}}；繁體中文、粵語及其他任何源語言一律譯為簡體中文。稿件屬新聞時事類時，還會套用新聞文體規範——多用動詞、數字前置、不用空泛模糊語、首次出現給全名與職銜、保留中文新聞慣用的香港政經用語。

      適合港台媒體稿件、粵語社交帖文與訪談、法庭與立法會報道、政策文件與新聞公報，以及任何需要轉成乾淨簡體中文的繁體、粵語文本。
