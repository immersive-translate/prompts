multiplePrompt: |-
  Translate the following items into {{to}}, keeping the `%%` separator between them and returning the same number of blocks in the same order. Output the translation only:

  {{text}}
subtitlePrompt: |-
  Translate the following subtitles into {{to}}, keeping the `%%` separator between them and returning the same number of blocks in the same order. Keep each subtitle short enough to read in one line, preserve speaker intent, and output the translation only:

  {{text}}
