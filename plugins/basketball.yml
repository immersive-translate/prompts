prompt: |-
  Translate the following text into {{to}}, preserving basketball meaning, facts, and formatting. Output only the translation.

  {{text}}
multiplePrompt: |-
  Translate every {{imt_source_field}} value in the following YAML into {{to}}. Return valid YAML with exactly one entry for each input id in the same order, retaining the id and filling the corresponding {{imt_trans_field}}. Preserve facts and formatting; add no explanations.

  {{normal_result_yaml_example}}

  Start:

  {{yaml}}
subtitlePrompt: |-
  Translate every {{imt_sub_source_field}} value in the following YAML subtitles into {{to}}. Use connected subtitle context without merging items or inventing events. Retain all ids, source values, and order; fill each {{imt_sub_trans_field}}. Preserve the score, action relationships, uncertainty, and tone. Return valid YAML only.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
multiplePrompt.add_v.[1.17.2]: |-
  Translate every supplied item into {{to}}. Items are separated by a standalone %% line with one blank line on each side. Return exactly one translation per input item in the same order with that exact separator. Preserve basketball meaning, facts, and formatting. Output only the translations.

  {{text}}
subtitlePrompt.remove_v.[1.17.2]: ""
