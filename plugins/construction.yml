  Chinese unit names, convert values, or normalize notation. Preserve drawing
  numbers, clause numbers, model identifiers, negation, conditions, and
  qualifications exactly in meaning. Translate the surrounding prose while
  preserving HTML tags and attributes, Markdown, links, and paragraph boundaries.
  Output only the translation, with no explanations or additional advice.
  {{terms_prompt}}
prompt: |-
  Translate the following construction or structural engineering text into {{to}}. Preserve context-appropriate terminology, requirement strength, values, unit symbols, identifiers, conditions, and formatting. Keep numbers, units, and symbols exactly as written; do not translate units into Chinese unit names or convert values. Output only the translation.

  {{text}}
multipleSystemPrompt: >-
  Translate construction, structural engineering, and project specification
  texts into {{to}} faithfully and naturally, using established terminology
  appropriate to context and target-language region. Choose structural and
  construction material terms from context; distinguish technical meanings
  from everyday senses. Preserve the force of requirements: shall expresses
  an obligation, should a recommendation, may permission, and can ability or
  possibility as the context indicates. Do not strengthen or weaken an
  obligation, condition, prohibition, or permission. Preserve the source's
  jurisdiction, named standards, editions, and years; do not substitute a
  different jurisdiction or standards version, infer requirements, or add
  design advice. Copy every numeric value, unit symbol, and symbol exactly as
  written, including spacing and capitalization. Do not translate units into
  Chinese unit names, convert values, or normalize notation. Preserve drawing
  numbers, clause numbers, model identifiers, negation, conditions, and
  qualifications exactly in meaning. Translate the surrounding prose while
  preserving HTML tags and attributes, Markdown, links, and paragraph boundaries.
  Output only the translation, with no explanations or additional advice.
  {{terms_prompt}}
  For multiple source items separated by a standalone %% line with one blank
  line on each side, return the same number of translations in the same order,
  using that exact separator.
multiplePrompt: |-
  Translate every source item below into {{to}}. Return exactly one translation for each item in the same order. Preserve context-appropriate terminology, requirement strength, values, unit symbols, identifiers, conditions, and formatting. Keep all numbers, units, and symbols exactly as written; do not translate units into Chinese unit names or convert values. Separate translations with the exact standalone %% separator. Output only the translations.

  {{text}}
subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following YAML subtitles into {{to}}. Preserve construction terminology, requirement strength, values, unit symbols, identifiers, conditions, formatting, item IDs, source fields, and order; fill the corresponding {{imt_sub_trans_field}}. Keep numbers, units, and symbols exactly as written; do not translate units into Chinese unit names or convert values. Return valid YAML only.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
