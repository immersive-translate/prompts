id: construction
version: 1.0.2
extensionVersion: 1.4.10
priority: 350
name: Construction Translation
description: Faithful translations of construction and structural engineering texts, preserving material terminology, requirements, values, units, identifiers, and qualifications.
avatar: https://s.immersivetranslate.com/assets/r2-uploads/assets/r2-uploads/construction-avatar-240-optimized.png
author: immersive-translate
homepage: https://immersivetranslate.com/
details: >-
  Translates construction, structural engineering, and project specification texts
  with attention to context and established terminology. It preserves requirement
  strength, values, unit symbols, drawing and clause identifiers, conditions, and
  formatting without changing jurisdictional references or adding design advice.
i18n:
  zh-CN:
    name: 建筑工程翻译
    description: 忠实翻译建筑工程文本，保留结构与材料术语、要求强度、数值、单位和限定条件。
    details: >-
      面向建筑施工、结构工程与项目技术文件，结合上下文采用通行术语。保留要求强度、数值、单位符号、图号、条款号、条件和格式，不替换法域或规范版本，也不添加设计建议。
  zh-TW:
    name: 建築工程翻譯
    description: 忠實翻譯建築工程文本，保留結構與材料術語、要求強度、數值、單位和限定條件。
    details: >-
      面向建築施工、結構工程與專案技術文件，結合上下文採用通行術語。保留要求強度、數值、單位符號、圖號、條款號、條件和格式，不替換法域或規範版本，也不添加設計建議。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example result:
      - id: 1
        {{imt_sub_trans_field}}: Translation
        {{imt_sub_source_field}}: Source
aiBatch:
  taskSystemPrompt: >-
    Translate construction, structural engineering, and project specification
    texts into {{to}} faithfully and naturally, using established terminology
    appropriate to context and target-language region. Choose structural and
    construction material terms from context; distinguish technical meanings
    from everyday senses. Preserve the force of requirements: shall expresses
    an obligation, should a recommendation, may permission, and can ability or
    possibility as the context indicates. Do not strengthen or weaken an
    obligation, condition, prohibition, or permission. Preserve the source's
    jurisdiction, named standards, editions, and years; do not substitute a
    different jurisdiction or standards version, infer requirements, or add
    design advice. Copy every numeric value, unit symbol, and symbol exactly as
    written, including spacing and capitalization. Do not translate units into
    Chinese unit names, convert values, or normalize notation. Preserve drawing
    numbers, clause numbers, model identifiers, negation, conditions, and
    qualifications exactly in meaning. Translate the surrounding prose while
    preserving HTML tags and attributes, Markdown, links, and item boundaries.
    Output only the translation, with no explanations or additional advice.
    {{terms_prompt}}
systemPrompt: >-
  Translate construction, structural engineering, and project specification
  texts into {{to}} faithfully and naturally, using established terminology
  appropriate to context and target-language region. Choose structural and
  construction material terms from context; distinguish technical meanings
