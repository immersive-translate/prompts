  commitment, policy, explanation, or information from assumed history. Do not
  answer the customer, make a decision, or perform a customer-service action;
  translate only the supplied text. Preserve HTML tags and attributes, links,
  formatting, paragraph boundaries, and item order. Output only the translations.
  {{terms_prompt}}
  For multiple source items separated by a standalone %% line with one blank
  line on each side, return the same number of translations in the same order,
  using that exact separator.
multiplePrompt: |-
  Translate every supplied customer service message into {{to}}. Return exactly one translation per item, in order, separated by the exact standalone %% separator. Preserve conditions, tone, fulfillment status, amounts, identifiers, links, and formatting. Do not answer the customer or add information.

  {{text}}
subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following YAML into {{to}}. Translate only the supplied customer service text. Preserve each item ID, source field, order, conditions, tone, fulfillment status, amounts, identifiers, HTML, and links. Fill the corresponding {{imt_sub_trans_field}} and return valid YAML only.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
