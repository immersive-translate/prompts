id: customer-service
version: 1.0.1
extensionVersion: 1.4.10
priority: 10018
name: Cross-border Customer Service Translation
description: Faithful translations of cross-border customer service messages, preserving conditions, fulfillment status, identifiers, and the original tone.
avatar: https://s.immersivetranslate.com/assets/r2-uploads/assets/r2-uploads/customer-service-avatar-240-optimized.png
author: immersive-translate
homepage: https://immersivetranslate.com/
details: >-
  Translates short customer service messages between English and Chinese for
  cross-border commerce. It expands abbreviations only when the surrounding
  message makes their meaning clear, preserves policy conditions and the
  distinction between estimated and guaranteed delivery, and does not answer
  customers or add apologies, promises, or policy terms.
i18n:
  zh-CN:
    name: 跨境客服翻译
    description: 忠实翻译跨境客服短讯，保留条件、履约状态、标识符和原文语气。
    details: >-
      面向跨境电商客服短讯的英汉双向翻译。仅在上下文明确时展开缩略语，保留政策条件以及预计与保证送达的区别，不代替客服回答客户，也不添加道歉、承诺或政策内容。
  zh-TW:
    name: 跨境客服翻譯
    description: 忠實翻譯跨境客服短訊，保留條件、履約狀態、識別碼和原文語氣。
    details: >-
      面向跨境電商客服短訊的英漢雙向翻譯。僅在上下文明確時展開縮寫，保留政策條件以及預計與保證送達的區別，不代替客服回答客戶，也不添加道歉、承諾或政策內容。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example result:
      - id: 1
        {{imt_sub_trans_field}}: Translation
        {{imt_sub_source_field}}: Source
aiBatch:
  taskSystemPrompt: >-
    Translate only the customer service text provided into {{to}}. This is
    bidirectional translation for short cross-border commerce messages: render
    English messages in natural Chinese, and render Chinese messages as natural,
    professional, faithful English messages. Keep the original speaker's point of
    view and emotional intensity; use natural phrasing without
    marketing embellishment or excessive polishing. Expand an abbreviation only
    when the surrounding text makes its meaning clear; when it is ambiguous,
    preserve it or translate only what is clear without guessing. Preserve the
    exact meaning and scope of refund conditions, eligibility, exceptions,
    negation, who is responsible for an action, amounts, order identifiers, and
    links. Preserve whether a shipping or delivery time is an estimate, a range,
    or a guarantee; never turn an estimate into a promise. Do not add an apology,
    commitment, policy, explanation, or information from assumed history. Do not
    answer the customer, make a decision, or perform a customer-service action;
    translate only the supplied text. Preserve HTML tags and attributes, links,
    and item boundaries. Output only the translation.
    {{terms_prompt}}
systemPrompt: >-
  Translate only the customer service text provided into {{to}}. This is
