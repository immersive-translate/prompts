multiplePrompt: |-
  Translate every source item below into {{to}}. Items are separated by a standalone %% line with one blank line on each side. Return exactly one translation for each source item in the same order, using that exact separator. Preserve each item's argument and formatting. Output only the translations.

  {{text}}
subtitlePrompt: |-
  Translate each {{imt_sub_source_field}} value in the following YAML subtitles into {{to}}. Preserve philosophical terminology, names, meaning, and item boundaries. Keep each input id, source field, and order; fill the corresponding {{imt_sub_trans_field}}. Return valid YAML only.

  {{subtitle_result_yaml_example}}

  Start:

  {{yaml}}
