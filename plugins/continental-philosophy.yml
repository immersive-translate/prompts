id: continental-philosophy
version: 1.0.4
extensionVersion: 1.4.10
priority: 460
name: Continental Philosophy Translation Expert
description: Faithful, context-aware translations of modern and contemporary continental philosophy, with careful handling of concepts, names, and argument structure.
avatar: ""
author: immersive-translate
homepage: https://immersivetranslate.com/
details: >-
  Translates modern and contemporary continental philosophy with attention to the
  source tradition, author, and local argument. It preserves conceptual distinctions,
  names, qualifications, negation, and citations without adding glosses or commentary.
i18n:
  zh-CN:
    name: 欧陆哲学翻译
    description: 面向近现代欧陆哲学文本，结合语境准确处理概念、人名与论证关系。
    details: >-
      翻译近现代欧陆哲学文本时，结合原文传统、作者和局部论证处理术语，保留概念区分、人名、限定、否定与引文，不添加注释或解释。
  zh-TW:
    name: 歐陸哲學翻譯
    description: 面向近現代歐陸哲學文本，結合語境準確處理概念、人名與論證關係。
    details: >-
      翻譯近現代歐陸哲學文本時，結合原文傳統、作者和局部論證處理術語，保留概念區分、人名、限定、否定與引文，不添加註解或解釋。
langOverrides: []
enableRichTranslate: true
env:
  imt_source_field: text
  imt_trans_field: text
  imt_sub_source_field: source
  imt_sub_trans_field: translation
  imt_yaml_item: |-
    - id: {{id}}
      {{imt_source_field}}: {{text}}
  imt_subtitle_yaml_item: |-
    - id: {{id}}
      {{imt_sub_source_field}}: {{text}}
  normal_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_source_field}}: Source
    Example result:
      - id: 1
        {{imt_trans_field}}: Translation
  subtitle_result_yaml_example: |-
    Example request:
      - id: 1
        {{imt_sub_source_field}}: Source
    Example result:
      - id: 1
        {{imt_sub_trans_field}}: Translation
        {{imt_sub_source_field}}: Source
aiBatch:
  taskSystemPrompt: >-
    Translate modern and contemporary continental philosophy into {{to}} faithfully
    and naturally. Interpret terminology in the context of the source tradition,
    author, and local argument; do not impose one universal vocabulary across
    different thinkers. Preserve distinctions the source explicitly makes between
    concepts, along with names in their established target-language forms, citations,
    negation, modality, and qualifications. Do not invent names or resolve genuine
    ambiguity by adding claims. Preserve HTML tags and their structure, Markdown,
    quotations, and paragraph boundaries. Add no explanations, notes, or unsolicited
    glosses. When Chinese is the target, translate established philosophical concepts
    into Chinese rather than leaving ordinary conceptual uses untranslated. In
    Heidegger contexts, distinguish Dasein (此在), Vorhandenheit (现成性 or
    现成在手状态), and Zuhandenheit (上手性 or 上手状态); use 共在 for
    Mitsein (not the generic paraphrase 共同存在). These are context-specific guides, not equivalents for all authors.
    Keep only the original spelling when the text discusses spelling or explicitly
    assigns a label; do not also supply its translation. Otherwise output only the target-language term, without repeating the original in parentheses. Do not append bilingual parentheses, definitions, or additional
    HTML tags absent from the source. Check term spellings and repetitions before
    returning the translation. Use natural, modern academic Chinese.
    {{terms_prompt}}
